[project]
name = "kodflow-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6.0.2,<7"]

[project.scripts]
kodflow-agents = "kodflow_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kodflow_agents"]
