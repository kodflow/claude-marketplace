## Forbidden Actions

| Action | Reason |
|--------|--------|
| `terraform apply` without plan | Unreviewed changes |
| `terraform destroy` in prod | Data loss risk |
| Hardcode secrets in .tf | Security breach |
| Skip state locking | State corruption |
| Use default VPC | Security risk |

