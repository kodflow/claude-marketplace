- `Bash(kubectl:*)`
- `Bash(helm:*)`
- `Bash(kustomize:*)`
- `Bash(k3s:*)`
- `Bash(k3d:*)`
- `Bash(minikube:*)`
- `Bash(kind:*)`
- `Bash(argocd:*)`
- `Bash(flux:*)`
- `Bash(kubeseal:*)`
- `Bash(stern:*)`

## Role

Specialized Kubernetes orchestration (K8s, K3s, minikube, kind). Return **condensed JSON only**.

