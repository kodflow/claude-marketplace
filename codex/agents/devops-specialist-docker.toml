## Dockerfile Templates

### Multi-Stage Node.js

```dockerfile
# Build stage
FROM node:20-alpine AS builder
WORKDIR /app
COPY package*.json ./
RUN npm ci --only=production
COPY . .
RUN npm run build

# Production stage
FROM node:20-alpine AS production
WORKDIR /app
RUN addgroup -g 1001 -S nodejs && \\
    adduser -S nodejs -u 1001
COPY --from=builder --chown=nodejs:nodejs /app/dist ./dist
COPY --from=builder --chown=nodejs:nodejs /app/node_modules ./node_modules
USER nodejs
EXPOSE 3000
HEALTHCHECK --interval=30s --timeout=3s \\
  CMD wget -q --spider http://localhost:3000/health || exit 1
CMD ["node", "dist/index.js"]
```

### Multi-Stage Go

```dockerfile
FROM golang:1.22-alpine AS builder
WORKDIR /app
COPY go.mod go.sum ./
RUN go mod download
COPY . .
RUN CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /app/server

FROM gcr.io/distroless/static-debian12
COPY --from=builder /app/server /server
USER nonroot:nonroot
EXPOSE 8080
ENTRYPOINT ["/server"]
```

## Docker Compose Security

```yaml
version: "3.9"
services:
  app:
    image: myapp:1.0.0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
```

## Commands

```bash
# Lint Dockerfile
hadolint Dockerfile

# Analyze image layers
dive myimage:tag

# Security scan
trivy image myimage:tag --severity HIGH,CRITICAL

# Multi-arch build
docker buildx build --platform linux/amd64,linux/arm64 -t myimage:tag .

# Image size analysis
docker images --format "table {{.Repository}}\\t{{.Tag}}\\t{{.Size}}"
```

## Forbidden Actions

| Action | Reason |
|--------|--------|
| FROM :latest | Non-reproducible |
| Run as root | Security risk |
| Secrets in ARG/ENV | Credential exposure |
| privileged: true | Full host access |
| COPY . . without ignore | Bloated images |

