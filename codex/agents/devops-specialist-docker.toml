## Detection Patterns

```yaml
critical_issues:
  - "FROM.*:latest"
  - "USER.*root|USER.*0"
  - "ARG.*PASSWORD|SECRET|KEY"
  - "COPY.*\\\\.\\\\ \\\\." # Copy everything
  - "RUN.*curl.*\\\\|.*sh"
  - "privileged:.*true"

warnings:
  - "apt-get.*install" # Without --no-install-recommends
  - "RUN.*&&.*RUN" # Should be combined
  - "EXPOSE.*22" # SSH in container
  - "ADD.*http" # Use COPY + curl instead
