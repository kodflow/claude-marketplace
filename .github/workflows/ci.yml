name: ci
on: [push, pull_request]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }

      # The repository is public. This is the gate, and it runs before anything
      # else has a chance to make the tree look fine.
      # The scanner is tested before it is trusted. It once passed 10 of 11
      # planted credentials, and nothing said so.
      - name: The secret scanner actually catches secrets
        run: python3 scripts/tests/test_sanitize.py

      - name: No credential may reach a public tree
        run: python3 scripts/sanitize.py .

      - name: No machine- or org-specific detail
        run: |
          set -e
          fail=0
          # Shapes, not values: a CI rule naming an internal host publishes it.
          for pat in '/home/[a-z][a-z0-9_-]*/' '/Users/[a-z][a-z0-9_-]*/' \
                     '\b192\.168\.[0-9]\+\.[0-9]\+\b' '\b10\.[0-9]\+\.[0-9]\+\.[0-9]\+\b'; do
            if grep -rIn --exclude-dir=.git --exclude=ci.yml -e "$pat" . ; then
              echo "::error::private detail present: $pat"; fail=1
            fi
          done
          exit $fail

      - name: Manifests parse and reference real paths
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(".")
          mk = json.loads((root/".claude-plugin/marketplace.json").read_text())
          bad = []
          for p in mk["plugins"]:
              sub = root / p["source"]["path"]
              if not (sub/".claude-plugin"/"plugin.json").exists():
                  bad.append(f"{p['name']}: no plugin.json at {sub}")
              else:
                  json.loads((sub/".claude-plugin"/"plugin.json").read_text())
          print(f"{len(mk['plugins'])} plugins declared")
          if bad: [print("  " + b) for b in bad]; sys.exit(1)
          PY

      - name: Skill and agent frontmatter is valid
        run: |
          pip install --quiet pyyaml
          python3 scripts/validate-frontmatter.py .

      # Context cost, not correctness: pinned model/effort, description and
      # SKILL.md budgets, copied memory blocks, bare cross-plugin references.
      # Every finding is a warning until a check is named in COST_CHECKS_STRICT,
      # so this step stays green while the catalogue is still dirty — a gate
      # that starts red is a gate people learn to skip. Tested before trusted,
      # like the secret scanner: a budget nobody measured measures nothing.
      - name: The cost guardrails hold
        run: python3 scripts/tests/test_context_cost.py

      - name: What the catalogue costs every session
        run: python3 scripts/check-context-cost.py .

      - name: Shell scripts parse
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      # _shared is copied into every plugin that references it, because a
      # plugin is installed alone and a link into a sibling plugin is broken
      # for every consumer. The copies must be identical.
      - name: Shared modules are identical across plugins
        run: |
          set -e
          for p in plugins/kodflow-review plugins/kodflow-devops; do
            diff -r plugins/kodflow-workflow/skills/_shared "$p/skills/_shared"
          done
          echo "_shared mirrors in sync"

      # The hooks block, rewrite and log on behalf of every consumer. Each of
      # those behaviours is asserted against the JSON Claude Code actually sends.
      - name: Hook scripts behave
        run: bash scripts/tests/test_hooks.sh

      # A plugin that ships a suite gets it run. Discovered, not listed: a
      # hand-kept list is how kodflow-shell's 31 assertions sat in the tree
      # for a day without anything running them.
      - name: Plugins test themselves
        run: |
          set -e
          ran=0
          for suite in plugins/*/tests/run.zsh plugins/*/tests/run-tests.sh; do
            [ -x "$suite" ] || continue
            echo "--- $suite"
            case "$suite" in
              *.zsh) command -v zsh >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }
                     zsh "$suite" ;;
              *)     bash "$suite" ;;
            esac
            ran=$((ran + 1))
          done
          echo "$ran plugin suite(s) ran"

      # /flow --check trusts this inventory to tell it which skills are live.
      # Its search roots come from the script's own location, so the layouts
      # are the thing that can break: a clone, a cache holding an obsolete
      # revision, a flat Codex home, and any of them under a path with a space.
      - name: The flow inventory reads every shipped layout
        run: bash scripts/tests/test_flow_inventory.sh

      # Pruning is invisible to the freshness check below: a generator that
      # stopped deleting produces no diff, it just leaves a dropped skill
      # installed for ever. So it is exercised against a seeded fixture.
      - name: The generator retires output whose source is gone
        run: python3 scripts/tests/test_build_codex.py

      # codex/ is generated from plugins/. A hand-edit there, or a source edit
      # that nobody regenerated, ships two versions of the same skill.
      - name: The codex tree matches its sources
        run: |
          python3 scripts/build-codex.py
          git diff --exit-code -- codex/ \
            || { echo "::error::codex/ is stale — run scripts/build-codex.py"; exit 1; }
