name: ci
on: [push, pull_request]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }

      # The repository is public. This is the gate, and it runs before anything
      # else has a chance to make the tree look fine.
      # The scanner is tested before it is trusted. It once passed 10 of 11
      # planted credentials, and nothing said so.
      - name: The secret scanner actually catches secrets
        run: python3 scripts/tests/test_sanitize.py

      - name: No credential may reach a public tree
        run: python3 scripts/sanitize.py .

      - name: No machine- or org-specific detail
        run: |
          set -e
          fail=0
          # Shapes, not values: a CI rule naming an internal host publishes it.
          for pat in '/home/[a-z][a-z0-9_-]*/' '/Users/[a-z][a-z0-9_-]*/' \
                     '\b192\.168\.[0-9]\+\.[0-9]\+\b' '\b10\.[0-9]\+\.[0-9]\+\.[0-9]\+\b'; do
            if grep -rIn --exclude-dir=.git --exclude=ci.yml -e "$pat" . ; then
              echo "::error::private detail present: $pat"; fail=1
            fi
          done
          exit $fail

      - name: Manifests parse and reference real paths
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(".")
          mk = json.loads((root/".claude-plugin/marketplace.json").read_text())
          bad = []
          for p in mk["plugins"]:
              sub = root / p["source"]["path"]
              if not (sub/".claude-plugin"/"plugin.json").exists():
                  bad.append(f"{p['name']}: no plugin.json at {sub}")
              else:
                  json.loads((sub/".claude-plugin"/"plugin.json").read_text())
          print(f"{len(mk['plugins'])} plugins declared")
          if bad: [print("  " + b) for b in bad]; sys.exit(1)
          PY

      - name: Skill and agent frontmatter is valid
        run: |
          pip install --quiet pyyaml
          python3 scripts/validate-frontmatter.py .

      # The mod lanes' wiring (kodflow/ktn-linter#788), read from the
      # workflows as YAML: every GATES target run by a blocking job here,
      # every `make` target a workflow runs declared, the ADVISORY latest lane
      # off push and pull_request and in no `needs`, setup-node by sha.
      - name: The mod lanes are wired as the Makefile declares
        run: make ci-gates-check

      # The lane scripts against a fake engine and a fake gh: neutral on
      # "turned off" (and red without the precondition), one issue for two
      # latest runs on the same gap, each ci-gates-check refusal planted.
      - name: The mod lane scripts behave
        run: make mod-lane-check

      # The orchestrator's model comes from detect-models.sh: no guess when the
      # cache is unreadable, never a gated model, a missing list failing closed.
      - name: The model detector neither guesses nor reports a gated model
        run: bash scripts/tests/test_detect_models.sh

      # Tested before trusted: an effort typo, an agent on a gated model and a
      # missing gated list are each planted and must be refused.
      - name: The frontmatter validator refuses what the model policy forbids
        run: python3 scripts/tests/test_validate_frontmatter.py

      # The gated models are read by the skills (_shared, the canonical copy)
      # and by kodflow-hooks, installed alone, which ships its own copy.
      - name: The gated-model list is the same in the skills and the hooks
        run: |
          diff plugins/kodflow-workflow/skills/_shared/gated-models.txt plugins/kodflow-hooks/hooks/gated-models.txt \
            || { echo "::error::gated-models.txt differs between _shared and kodflow-hooks"; exit 1; }

      # /docs computes the documents state itself when kodflow-hooks is not
      # installed, from a copy of the hooks' catalogue. One source, two places.
      - name: The documents catalogue is the same in /docs and the hooks
        run: |
          diff plugins/kodflow-hooks/hooks/docs-catalog.json plugins/kodflow-workflow/skills/docs/catalogue.json \
            || { echo "::error::catalogue.json differs from kodflow-hooks' docs-catalog.json"; exit 1; }

      # route-agent.sh carries agents.sh, the hooks' reader of agent
      # definitions (project, user, installed plugin), because a plugin is
      # installed alone and cannot source a sibling's file. One source, two
      # places: the copies must not drift.
      - name: The router's agent reader is the hooks' agents.sh
        run: |
          diff plugins/kodflow-hooks/hooks/scripts/lib/agents.sh plugins/kodflow-workflow/skills/_shared/scripts/agents.sh \
            || { echo "::error::agents.sh differs between kodflow-hooks and _shared/scripts"; exit 1; }

      # One case per exit code of the router, against a fixture plugin cache,
      # and the shipped routing table against the shipped agents.
      - name: The router resolves, namespaces and refuses as documented
        run: bash scripts/tests/test_route_agent.sh

      # /hunt's scripts: concurrent ledger writers, the heavy-job queue, slot
      # reservation at the cap, all-or-nothing integration, hunt-push refusing
      # without convergence — the status.json contract kodflow-hud reads, its
      # copies of the fixtures byte for byte kodflow-workflow's, and one whole
      # cycle played by the scripts alone (e2e dry run).
      - name: The /hunt scripts behave
        run: |
          shellcheck plugins/kodflow-workflow/bin/hunt-* plugins/kodflow-workflow/skills/hunt/tests/*.sh
          bash plugins/kodflow-workflow/skills/hunt/tests/run.sh
          bash plugins/kodflow-workflow/skills/hunt/tests/e2e-dryrun.sh
          bash plugins/kodflow-workflow/skills/hunt/tests/status-contract.sh
          shellcheck scripts/check-hunt-fixtures.sh
          bash scripts/check-hunt-fixtures.sh

      # The tier judges' shared vectors (frontmatter fields, mode, Workflow
      # scripts): tests/mod/tier-vectors.ts is the fixture byte for byte, so
      # the engine's tests read the same cases as the shell and Python.
      - name: The tier vectors module is the fixture
        run: |
          shellcheck scripts/check-tier-vectors.sh
          bash scripts/check-tier-vectors.sh

      # Context cost, not correctness: pinned model/effort, description and
      # SKILL.md budgets, copied memory blocks, bare cross-plugin references.
      # Every finding is a warning until a check is named in COST_CHECKS_STRICT
      # — a gate that starts red is a gate people learn to skip. model_effort
      # is strict since every agent pins model and effort and every skill pins
      # effort and inherits the model: that check now keeps the catalogue
      # clean. Tested before trusted, like the secret scanner: a budget nobody
      # measured measures nothing.
      - name: The cost guardrails hold
        run: python3 scripts/tests/test_context_cost.py

      - name: What the catalogue costs every session
        env:
          COST_CHECKS_STRICT: model_effort
        run: python3 scripts/check-context-cost.py .

      - name: The usage report prices and counts what the transcripts say
        run: python3 scripts/tests/test_usage_report.py

      # The routing gate of kodflow-hooks reads routing-index.tsv, compiled
      # from the Keywords column of _shared/specialists.md. A keyword edited
      # by hand on either side would route on a table nobody reviews.
      - name: The routing index matches specialists.md
        run: |
          python3 scripts/tests/test_routing_index.py
          python3 scripts/build-routing-index.py
          git diff --exit-code -- plugins/kodflow-hooks/hooks/routing-index.tsv \
            || { echo "::error::routing-index.tsv is stale — run scripts/build-routing-index.py"; exit 1; }

      # The hooks inject tier-table.tsv into the orchestrator and into the
      # sub-agents that can delegate; it is compiled from model-policy.md
      # section 2 and mirrored with _shared. A hand edit would teach a tier
      # nobody reviewed.
      # A dispatch to a built-in agent has no frontmatter of ours: the call must
      # carry model and effort (model-policy section 2), or point to the tier
      # table, or say [tier-exempt: reason] (capped). Tested before trusted.
      - name: Every dispatch site states its model and effort
        run: |
          python3 scripts/tests/test_check_dispatch_tier.py
          python3 scripts/check-dispatch-tier.py

      - name: The tier table matches model-policy.md
        run: |
          python3 scripts/tests/test_tier_table.py
          python3 scripts/build-tier-table.py --check

      # Agents do not receive the shared files, so the plan review contract is
      # copied into each routed agent; a missing or drifted copy fails here.
      - name: Every routed agent carries the plan review mode
        run: python3 scripts/tests/test_plan_review_mode.py

      # The copies are written by sync_plan_review_mode.py, tested on a
      # fixture (a section in the middle and at the end of a file) first.
      - name: The plan review mode copies are what the sync script writes
        run: |
          python3 scripts/tests/test_sync_plan_review_mode.py
          python3 scripts/sync_plan_review_mode.py --check

      # The git commands Plan review mode prescribes, against a repository
      # whose external diff, textconv, pager and filter drivers are a witness.
      - name: The prescribed git commands never run a program of the repository
        run: bash scripts/tests/test_git_readonly.sh

      # The dispatch gates enforce what model-policy.md says; the file must keep
      # saying that every dispatch passes model and effort, the fork rule and
      # the exemptions.
      - name: The model policy states the explicit dispatch rule
        run: python3 scripts/tests/test_model_policy.py

      # The systemd specialist exists for its evidence rules (#106): raw man
      # pages fetched by a scoped curl, never a WebFetch summary, a version
      # cited, writes in the brief's scratch directory only. Asserted in the
      # agent and its Codex copy, with the routing split it depends on.
      - name: The systemd specialist keeps its evidence contract
        run: python3 scripts/tests/test_systemd_specialist.py

      - name: Shell scripts parse
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      # _shared is copied into every plugin that references it, because a
      # plugin is installed alone and a link into a sibling plugin is broken
      # for every consumer. The copies must be identical.
      - name: Shared modules are identical across plugins
        run: |
          set -e
          for p in plugins/kodflow-review plugins/kodflow-devops; do
            diff -r plugins/kodflow-workflow/skills/_shared "$p/skills/_shared"
          done
          echo "_shared mirrors in sync"

      # The hooks block and log on behalf of every consumer. Each of those
      # behaviours is asserted against the JSON Claude Code actually sends,
      # and the shell guards against the bash-guard corpus
      # (plugins/kodflow-hooks/tests/fixtures/bash-guard.jsonl): rc and motif
      # of every line, known gaps reported, not counted.
      - name: Hook scripts behave, bash-guard corpus included
        run: bash scripts/tests/test_hooks.sh

      # The commit identity a forge expects (lib/identity.sh): real
      # repositories, example rules, git's own answer on an empty address.
      - name: Commit identity check
        run: bash plugins/kodflow-hooks/tests/test_identity.sh

      # on-session.sh warns when an installed guard differs from the
      # fingerprint shipped with it. The file is generated; a change to a
      # guard that did not regenerate it would make every session warn.
      - name: Guard fingerprints match the scripts
        run: bash scripts/hooks-fingerprints.sh --check

      # hooks/patterns is kodflow/post-commit's patterns.txt and
      # patterns-strict.txt at the commit hooks/patterns/SOURCE pins. The
      # plugin reads only that copy, so a hand edit or a half-done sync would
      # ship rules the gate does not hold. Network here, never at run time.
      - name: Vendored patterns match kodflow/post-commit at the pinned commit
        run: bash scripts/sync-post-commit-patterns.sh --check

      # The zsh suites need zsh. Installing it is a network call that has failed
      # on a resolver outage (security.ubuntu.com, which the runner's apt mirror
      # list routes every pocket through), so it gets its own step, short bounded
      # attempts, and a fallback to the plain Ubuntu archives, bypassing the
      # runner's mirror list. If zsh is still missing the step fails: a suite is
      # never skipped for want of its shell.
      - name: zsh is available for the zsh suites
        timeout-minutes: 12
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
            codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
            # The fallback list: the main archive, no mirror indirection.
            alt=$(mktemp -d)
            printf 'deb http://archive.ubuntu.com/ubuntu %s main universe\ndeb http://archive.ubuntu.com/ubuntu %s-updates main universe\n' \
              "$codename" "$codename" > "$alt/alt.list"
            install_zsh() {
              # shellcheck disable=SC2086
              sudo timeout 90 apt-get update -qq $opts "$@" \
                || echo "::warning::apt-get update failed, installing from the index at hand"
              # shellcheck disable=SC2086
              sudo timeout 120 apt-get install -y -qq $opts "$@" zsh
            }
            for attempt in 1 2 3; do
              if [ "$attempt" -eq 1 ]; then
                install_zsh && break
              else
                echo "::warning::falling back to archive.ubuntu.com (attempt $attempt)"
                getent hosts archive.ubuntu.com security.ubuntu.com || true
                install_zsh -o Dir::Etc::sourcelist="$alt/alt.list" -o Dir::Etc::sourceparts=/dev/null && break
              fi
              echo "::warning::zsh install failed (attempt $attempt)"
              sleep $((attempt * 15))
            done
          fi
          command -v zsh >/dev/null 2>&1 || { echo "::error::zsh could not be installed, the zsh suites cannot run"; exit 1; }
          zsh --version

      # A plugin that ships a suite gets it run. Discovered, not listed: a
      # hand-kept list is how kodflow-shell's 31 assertions sat in the tree
      # for a day without anything running them.
      - name: Plugins test themselves
        run: |
          set -e
          ran=0
          for suite in plugins/*/tests/run.zsh plugins/*/tests/run-tests.sh; do
            [ -x "$suite" ] || continue
            echo "--- $suite"
            case "$suite" in
              *.zsh) zsh "$suite" ;;
              *)     bash "$suite" ;;
            esac
            ran=$((ran + 1))
          done
          echo "$ran plugin suite(s) ran"

      # /flow --check trusts this inventory to tell it which skills are live.
      # Its search roots come from the script's own location, so the layouts
      # are the thing that can break: a clone, a cache holding an obsolete
      # revision, a flat Codex home, and any of them under a path with a space.
      - name: The flow inventory reads every shipped layout
        run: bash scripts/tests/test_flow_inventory.sh

      # /recap prints what recap.sh reads: who acts, what is blocked, which
      # subagents run on which branch, and whether a loop iteration changed.
      - name: The recap reads the session as the table needs it
        run: bash scripts/tests/test_recap.sh

      # /docs writes what docs.sh says is missing, and the documents panel
      # reads the manifest it rewrites: the state per document, unknown keys
      # kept, the catalogue's order, and its refusals.
      - name: The documents state and manifest are what /docs relies on
        run: bash scripts/tests/test_docs.sh

      # /project creates every new checkout under the CODE_HOME this prints.
      # A wrong pick scatters code into a folder macOS may lock the shell out
      # of, so the ranking is asserted against fake homes on both platforms.
      - name: The code-home locator picks the right folder
        run: bash scripts/tests/test_locate_code_home.sh

      # A plugin a project enables for itself (scripts/install-exclude.txt)
      # is never installed for the user, and the rest of the manifest is.
      - name: The installer skips the per-project plugins, and only them
        run: bash scripts/tests/test_install.sh

      # Pruning is invisible to the freshness check below: a generator that
      # stopped deleting produces no diff, it just leaves a dropped skill
      # installed for ever. So it is exercised against a seeded fixture.
      - name: The generator retires output whose source is gone
        run: python3 scripts/tests/test_build_codex.py

      # codex/ is generated from plugins/. A hand-edit there, or a source edit
      # that nobody regenerated, ships two versions of the same skill.
      - name: The codex tree matches its sources
        run: |
          python3 scripts/build-codex.py
          git diff --exit-code -- codex/ \
            || { echo "::error::codex/ is stale — run scripts/build-codex.py"; exit 1; }

  # macOS runs hooks with /bin/bash 3.2: no associative arrays, no ;&, and
  # global substitutions that are quadratic. The same suites, that shell.
  hooks-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: bash-guard corpus and hook suite under /bin/bash 3.2
        run: |
          /bin/bash --version | head -1
          HOOK_SHELL=/bin/bash /bin/bash scripts/tests/test_hooks.sh
      - name: Delegation gate under /bin/bash 3.2
        run: /bin/bash plugins/kodflow-hooks/tests/test_root_gate.sh
      - name: Routing gate, gated-model fallback and agent feedback under /bin/bash 3.2
        run: HOOK_SHELL=/bin/bash /bin/bash plugins/kodflow-hooks/tests/test_agents.sh
      - name: Command scope advice under /bin/bash 3.2
        run: HOOK_SHELL=/bin/bash /bin/bash plugins/kodflow-hooks/tests/test_scope.sh
      - name: The prescribed git commands under /bin/bash 3.2 and BSD script(1)
        run: /bin/bash scripts/tests/test_git_readonly.sh
      - name: Router under /bin/bash 3.2
        run: /bin/bash scripts/tests/test_route_agent.sh
      - name: Cleanup of a subagent's worktree under /bin/bash 3.2
        run: /bin/bash plugins/kodflow-hooks/tests/test_cleanup.sh
      - name: Commit identity check under /bin/bash 3.2
        run: HOOK_SHELL=/bin/bash /bin/bash plugins/kodflow-hooks/tests/test_identity.sh
      - name: Recap reader under /bin/bash 3.2
        run: RECAP_BASH=/bin/bash /bin/bash scripts/tests/test_recap.sh
      - name: Documents state under /bin/bash 3.2
        run: DOCS_BASH=/bin/bash /bin/bash scripts/tests/test_docs.sh
      # kodflow-gamedev's SubagentStart hook (rules-digest.sh) and the rest of
      # its suite, under the shell macOS runs hooks with.
      - name: kodflow-gamedev's suite under /bin/bash 3.2
        run: /bin/bash plugins/kodflow-gamedev/tests/run-tests.sh

  # kodflow-hooks' mod (hooks/mod/): function hooks the engine loads, so they
  # are checked by the engine itself, at the version the README names as
  # tested. Bumped by hand: a new release can move the plugin API.
  mod:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.296
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }

      - name: Claude Code, pinned
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      # Every warning and every error fails the job, the missing-version one
      # included. Each plugin.json carries a version derived from the plugin's
      # content (scripts/stamp-versions.py): it changes whenever a file does,
      # so `claude plugin update` still sees every change. A version that is
      # only bumped by hand would freeze users on their cached copy.
      - name: Plugin versions follow the plugin's content
        run: python3 scripts/stamp-versions.py --check

      - name: Plain strict validation of every plugin
        run: |
          for p in plugins/*/; do
            echo "== $p"
            claude plugin validate --strict "$p"
          done

      - name: The engine reads the plugin as meant
        run: |
          set +e
          claude plugin validate --strict --json plugins/kodflow-hooks > validate.json
          set -e
          cat validate.json
          python3 - <<'PY'
          import json, sys
          r = json.load(open("validate.json"))
          parts = [r["manifest"]] + r.get("contents", [])
          errors = [e for p in parts for e in p.get("errors", [])]
          warnings = [w for p in parts for w in p.get("warnings", [])]
          notes = " ".join(n for p in parts for n in p.get("notes", []))
          bad = errors + warnings
          for item in bad:
              print("::error::%s" % item)
          if "./mod/register.ts hooks:" not in notes:
              print("::error::the hooks module was not read"); sys.exit(1)
          sys.exit(1 if bad else 0)
          PY

      - name: The mod's tests, in the engine (claude plugin test)
        run: claude plugin test plugins/kodflow-hooks

      # kodflow-hud: an optional mod of its own (two panes, toasts), held to
      # the same two checks.
      - name: The engine reads kodflow-hud as meant
        run: |
          set +e
          claude plugin validate --strict --json plugins/kodflow-hud > validate-hud.json
          set -e
          cat validate-hud.json
          python3 - <<'PY'
          import json, sys
          r = json.load(open("validate-hud.json"))
          parts = [r["manifest"]] + r.get("contents", [])
          errors = [e for p in parts for e in p.get("errors", [])]
          warnings = [w for p in parts for w in p.get("warnings", [])]
          notes = " ".join(n for p in parts for n in p.get("notes", []))
          bad = errors + warnings
          for item in bad:
              print("::error::%s" % item)
          if "./mod/register.tsx hooks:" not in notes:
              print("::error::the hooks module was not read"); sys.exit(1)
          sys.exit(1 if bad else 0)
          PY

      - name: kodflow-hud's tests, in the engine (claude plugin test)
        run: claude plugin test plugins/kodflow-hud

      # kodflow-gamedev: agents, skills and one command hook, no mod. Held to
      # the same validator.
      - name: The engine reads kodflow-gamedev as meant
        run: |
          set +e
          claude plugin validate --strict --json plugins/kodflow-gamedev > validate-gamedev.json
          set -e
          cat validate-gamedev.json
          python3 - <<'PY'
          import json, sys
          r = json.load(open("validate-gamedev.json"))
          parts = [r["manifest"]] + r.get("contents", [])
          errors = [e for p in parts for e in p.get("errors", [])]
          warnings = [w for p in parts for w in p.get("warnings", [])]
          bad = errors + warnings
          for item in bad:
              print("::error::%s" % item)
          sys.exit(1 if bad else 0)
          PY

      # Also the bash-guard corpus against the mod's guards (the same rows the
      # shell job plays against on-tool.sh) and the module's invariants.
      - name: The conformance corpus, a real disk, several processes (node)
        run: node plugins/kodflow-hooks/tests/mod/run-node.ts

  # kodflow-ktn: ktn-linter's mod. Its floor is Claude Code 2.1.299, the
  # oldest version kodflow/ktn-linter#774 measured, above the engine the job
  # above pins: it gets an engine of its own, pinned and bumped by hand.
  # Nothing here can redden ktn-linter's release: this repository publishes
  # the plugin, by commit (git-subdir) and by its own kodflow-ktn/v* tags
  # (kodflow-ktn-release.yml), and ktn-linter does not depend on it. The
  # latest engine is mod-latest.yml's, scheduled and advisory (#788).
  mod-ktn:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.301
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }

      # The pure modules — the activation predicate replayed on ktn-linter's
      # golden table, the reducer, the renderer — under node alone: no engine,
      # no npm dependency, the TypeScript run as it is. Before the engine is
      # installed, so its verdict stands whatever happens to the engine.
      - name: kodflow-ktn's pure modules (node --test)
        run: make mod-pure

      - name: Claude Code, pinned
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      # make mod-check (the gate GATES names): the pure modules again, the
      # fixtures' pin, the validator — exactly one session.start, no tool
      # hook, the surface tests/fixtures/surface.json commits — and
      # `claude plugin test` behind its precondition: a probe mod
      # (scripts/mod-lane/probe) asked first, so hooks modules turned off on
      # the runner end the engine lane neutral with an annotation, never red.
      - name: kodflow-ktn's lanes (make mod-check)
        run: make mod-check
