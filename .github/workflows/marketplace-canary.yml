name: Marketplace canary
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full Git SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - name: Build and validate the release profiles
        env:
          RELEASE_SHA: ${{ inputs.commit }}
        run: |
          pip install --quiet uv==0.13.9
          uv sync --project scripts --locked
          uv run --project scripts python scripts/plugin-release.py --ref "$RELEASE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketplace-${{ inputs.commit }}
          path: dist/releases/${{ inputs.commit }}/
          if-no-files-found: error
