# Marketplace canary — a candidate commit, before it reaches main.
#
# prepare builds the release profiles of the commit (scripts/plugin-release.py)
# and uploads them as marketplace-<sha>. Then, each on its own runner:
#   smoke     plugin-smoke.yml serving that artifact's claude-full profile, which
#             must first be the commit byte for byte (scripts/tests/release_tree.py);
#   golden    what a Claude user loads, against main at the reference commit:
#             every agent and skill still there, each unchanged unless
#             scripts/tests/fixtures/canary/deviations.json names it (the only
#             place those intended differences are listed);
#   migration a user installed at the start commit runs marketplace update and
#             plugin update, and lands on the candidate (versions, commit,
#             bytes). The published URL is sent to a local bare repository by
#             url.insteadOf in an isolated HOME: nothing is fetched from GitHub.
name: Marketplace canary
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full Git SHA to build
        required: true
        type: string
      from:
        description: Commit the migration starts from (main before #168)
        required: false
        type: string
        default: 847a1a4be0b830992eecc7cc6717487981ba6e04

concurrency:
  group: marketplace-canary-${{ inputs.commit }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.13' }
      - name: Build and validate the release profiles
        env:
          RELEASE_SHA: ${{ inputs.commit }}
        run: |
          pip install --quiet uv==0.13.9
          uv sync --project scripts --locked
          uv run --project scripts python scripts/plugin-release.py --ref "$RELEASE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketplace-${{ inputs.commit }}
          path: dist/releases/${{ inputs.commit }}/
          if-no-files-found: error

  smoke:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/plugin-smoke.yml
    with:
      ref: ${{ inputs.commit }}
      artifact: marketplace-${{ inputs.commit }}

  golden:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.13' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: marketplace-${{ inputs.commit }}
          path: ${{ runner.temp }}/release
      - name: The claude-full profile is the commit
        run: python3 scripts/tests/release_tree.py "$RUNNER_TEMP/release" "$RUNNER_TEMP/claude-full"
      - name: The profile loads what main loaded, the listed deviations aside
        run: |
          pip install --quiet uv==0.13.9
          uv run --project scripts --locked python scripts/tests/canary_golden.py check \
            scripts/tests/fixtures/canary/golden.json scripts/tests/fixtures/canary/deviations.json \
            "$RUNNER_TEMP/claude-full"

  migration:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.13' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - name: Claude Code, at the version .github/versions.env pins
        run: |
          . ./.github/versions.env
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - name: A user at the start commit updates to the candidate
        env:
          FROM: ${{ inputs.from }}
        run: bash scripts/tests/smoke-plugins.sh --migrate-from "$FROM" --work "$RUNNER_TEMP/smoke"
