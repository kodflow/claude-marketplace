# kodflow-ktn-release — the mod's own publication (kodflow/ktn-linter#788).
#
# The mod is a plugin of this marketplace, never an artefact of ktn-linter: no
# Go tag, no Go release waits on it, and nothing here can redden one. A
# consumer gets it at the marketplace commit or pins one of these
# tags in its own settings ("ref": "kodflow-ktn/v0.1.0").
#
# The gate is the pinned lane itself: the tag's commit passes `make mod-check`
# on the engine mod-ktn of ci.yml runs, kodflow-ktn's declared floor
# (targets.claude.minimumVersion), before a release names it. The advisory latest lane
# (mod-latest.yml) is in no `needs` here, and never will be: a new Claude Code
# release must not hold up — or take back — a published version.
name: kodflow-ktn-release

on:
  push:
    tags: ['kodflow-ktn/v*']

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - name: Claude Code, at kodflow-ktn's floor as in ci.yml
        run: |
          floor=$(jq -er '.extensions["io.github.kodflow"].targets.claude.minimumVersion' plugins/kodflow-ktn/plugin.json)
          npm install -g "@anthropic-ai/claude-code@${floor}"
      - name: The tag passes the mod's lanes
        run: make mod-check

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: A release named by the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "kodflow-ktn at ${GITHUB_SHA}: pin it with \"ref\": \"${GITHUB_REF_NAME}\" in extraKnownMarketplaces (see the repository README)."
