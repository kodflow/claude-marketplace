  - shell.execute
modelClass: deep
inputSchema: ./input.schema.json
outputSchema: ./output.schema.json
sideEffects: none
claude:
  tools: Read, Glob, Grep, Bash, WebFetch, mcp__context7__*
  model: opus
  effort: medium
  color: cyan
