apiVersion: io.github.kodflow/role/v1
id: engine-specialist-godot
description: 'Godot 4.7 3D animation engineering: Skeleton3D poses, BoneAttachment3D props,
  AnimationPlayer and AnimationTree, GLB skeleton import, SkeletonModifier3D and IK, landmark
  nodes, deterministic per-frame sampling of bones, props and landmarks for the plugin''s
  Godot sampler, and the Godot MCP tools. Called by the kodflow-gamedev skills.'
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - shell.execute
modelClass: deep
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: engine-specialist-godot task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: engine-specialist-godot result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: none
claude:
  tools: Read, Glob, Grep, Bash, WebFetch, mcp__context7__*
  model: opus
  effort: medium
  color: blue
