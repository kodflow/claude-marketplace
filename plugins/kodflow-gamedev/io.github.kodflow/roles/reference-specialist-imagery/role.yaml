apiVersion: io.github.kodflow/role/v1
id: reference-specialist-imagery
description: 'Licensed reference imagery for combat moves: finds candidate images in museum
  open-access collections, Wikimedia Commons and Wiktenauer, with licence evidence read from
  the source, and flags mocap datasets whose licence forbids commercial use. Called by the
  kodflow-gamedev skills; returns panel-member/v1 JSON.'
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - shell.execute
modelClass: standard
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: reference-specialist-imagery task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: reference-specialist-imagery result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: none
claude:
  tools: Read, Glob, Grep, Bash, WebFetch
  model: sonnet
  effort: medium
  color: yellow
