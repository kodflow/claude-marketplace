apiVersion: io.github.kodflow/role/v1
id: anatomy-specialist-biomechanics
description: 'Human anatomy and biomechanics for combat animation: joint ranges of motion
  from a sourced table, proximal-to-distal sequencing, forearm pronation and handedness, grip,
  stance, centre of mass, arm and leg counter-rotation in a run. Called by the kodflow-gamedev
  skills; returns panel-member/v1 JSON with measurable constraints.'
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - shell.execute
modelClass: deep
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: anatomy-specialist-biomechanics task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: anatomy-specialist-biomechanics result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: none
claude:
  tools: Read, Glob, Grep, Bash, WebFetch
  model: opus
  effort: medium
  color: green
