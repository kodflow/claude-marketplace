apiVersion: io.github.kodflow/role/v1
id: developer-specialist-python
description: Python specialist — analyses Python but has no Write tool and does not create
  worktrees, commit, use make, or write through gh; a fix brief goes to general-purpose with
  [general-purpose-ok]. Use when a change touches .py files, pyproject.toml or requirements
  files. Escalate to opus/medium when it spans several modules, asyncio or thread concurrency,
  or a protocol.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - shell.execute
modelClass: standard
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-python task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-python result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: none
claude:
  tools: Read, Glob, Grep, Bash, WebFetch, mcp__context7__*
  model: sonnet
  effort: medium
  color: blue
