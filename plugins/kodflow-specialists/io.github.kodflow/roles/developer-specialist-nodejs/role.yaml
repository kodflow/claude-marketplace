apiVersion: io.github.kodflow/role/v1
id: developer-specialist-nodejs
description: Node.js/TypeScript specialist — writes and analyses it but does not create worktrees,
  commit, or use gh/make; a fix-and-commit brief goes to general-purpose with [general-purpose-ok].
  Use when a change touches .ts/.js files, package.json or tsconfig.json. Escalate to opus/medium
  when it spans several packages, async concurrency, or a wire protocol.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - repository.write
  - shell.execute
modelClass: standard
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-nodejs task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-nodejs result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: workspace
claude:
  tools: Read, Glob, Grep, Write, Bash, WebFetch, mcp__context7__*
  model: sonnet
  effort: medium
  color: blue
