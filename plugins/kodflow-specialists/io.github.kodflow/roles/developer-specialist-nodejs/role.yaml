apiVersion: io.github.kodflow/role/v1
id: developer-specialist-nodejs
description: Node.js/TypeScript specialist — writes and analyses it but does not create worktrees,
  commit, or use gh/make; a fix-and-commit brief goes to general-purpose with [general-purpose-ok].
  Use when a change touches .ts/.js files, package.json or tsconfig.json. Escalate to opus/medium
  when it spans several packages, async concurrency, or a wire protocol.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - repository.write
  - shell.execute
modelClass: standard
inputSchema: ./input.schema.json
outputSchema: ./output.schema.json
sideEffects: workspace
claude:
  tools: Read, Glob, Grep, Write, Bash, WebFetch, mcp__context7__*
  model: sonnet
  effort: medium
  color: blue
