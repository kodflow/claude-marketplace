apiVersion: io.github.kodflow/role/v1
id: developer-specialist-react
description: React 19 specialist — JSX/TSX, hooks, React Server Components, Suspense boundaries,
  Concurrent Mode. Use when a change touches .jsx or .tsx files, or a node project declares
  a react dependency. Escalate to opus/medium when the change spans several modules, server/client
  boundaries, or concurrent rendering.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - repository.write
  - shell.execute
modelClass: standard
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-react task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-react result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: workspace
claude:
  tools: Read, Glob, Grep, Edit, Write, Bash, mcp__context7__*, WebFetch
  model: sonnet
  effort: medium
  color: blue
