apiVersion: io.github.kodflow/role/v1
id: devops-specialist-security
description: DevSecOps scanning specialist — vulnerability detection, compliance checking
  and secrets scanning; returns JSON with findings and remediation. Use when a task asks for
  a vulnerability, CVE, compliance or leaked-secret scan of images, dependencies or infrastructure.
  Escalate to opus/medium when findings span several components or an exploit chain.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - shell.execute
modelClass: standard
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: devops-specialist-security task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: devops-specialist-security result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: none
claude:
  tools: Read, Glob, Grep, SendMessage, TaskUpdate, Bash, WebFetch, mcp__context7__*
  model: sonnet
  effort: medium
  color: orange
