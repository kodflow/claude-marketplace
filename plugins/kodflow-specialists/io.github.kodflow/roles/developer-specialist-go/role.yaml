apiVersion: io.github.kodflow/role/v1
id: developer-specialist-go
description: Go specialist — writes and analyses Go but does not create worktrees, commit,
  or use gh/make; a fix-and-commit brief goes to general-purpose with [general-purpose-ok].
  Use when a change touches .go files, go.mod or go.work, or a Go API or design question.
  Escalate to opus/medium when it spans several packages, goroutine state, or a wire protocol.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - repository.write
  - shell.execute
modelClass: standard
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-go task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-go result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: workspace
claude:
  tools: Read, Glob, Grep, Write, Bash, WebFetch, mcp__context7__*
  model: sonnet
  effort: medium
  color: blue
