apiVersion: io.github.kodflow/role/v1
id: developer-specialist-zig
description: Zig specialist — analyses Zig but has no Write tool and does not create worktrees,
  commit, or use gh/make; a fix brief goes to general-purpose with [general-purpose-ok]. Use
  when a change touches .zig files, build.zig or build.zig.zon. Escalate to opus/medium when
  it spans several modules, threads, or a wire protocol.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - shell.execute
modelClass: standard
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-zig task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-zig result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: none
claude:
  tools: Read, Glob, Grep, Bash, WebFetch, mcp__context7__*
  model: sonnet
  effort: medium
  color: blue
