apiVersion: io.github.kodflow/role/v1
id: data-specialist-postgres
description: PostgreSQL specialist — schema design, query optimisation, EXPLAIN analysis,
  index selection and migration safety. Use when a task touches .sql files, migrations, psql
  output, EXPLAIN plans or PostgreSQL syntax. Escalate to opus/medium when the change spans
  several tables or services, locking and concurrency, or a replication protocol.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - repository.write
  - shell.execute
modelClass: standard
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: data-specialist-postgres task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: data-specialist-postgres result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: workspace
claude:
  tools: Read, Glob, Grep, Edit, Write, Bash, mcp__context7__*, WebFetch
  model: sonnet
  effort: medium
  color: cyan
