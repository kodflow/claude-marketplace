apiVersion: io.github.kodflow/role/v1
id: developer-executor-security
description: Security analyzer — taint analysis (source to sink), OWASP Top 10, hardcoded
  secrets, injection, crypto misuse and supply-chain risks; returns JSON with taint paths
  and CWE references. Use when a diff touches input parsing, auth, crypto, secrets or dependencies.
  Escalate to opus/max when a taint path or exploit one xhigh pass did not settle.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  - web.official-docs
  optional:
  - repository.write
  - shell.execute
modelClass: verify
inputSchema: ./input.schema.json
outputSchema: ./output.schema.json
sideEffects: none
claude:
  tools: Read, Glob, Grep, Write, Bash, mcp__context7__resolve-library-id, mcp__context7__query-docs,
    WebFetch, SendMessage, TaskCreate, TaskUpdate, TaskList, TaskGet
  model: opus
  effort: xhigh
  color: blue
