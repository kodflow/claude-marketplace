apiVersion: io.github.kodflow/role/v1
id: developer-executor-design
description: Design and architecture analyzer — antipatterns, DDD violations, layering issues,
  SOLID breaches; returns JSON with pattern references and fixes. Use when a review needs
  a structure pass over new modules, interfaces or package boundaries.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - repository.write
  - shell.execute
modelClass: standard
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-executor-design task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-executor-design result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: workspace
claude:
  tools: Read, Glob, Grep, Write, Bash, mcp__context7__resolve-library-id, mcp__context7__query-docs,
    WebFetch, SendMessage, TaskCreate, TaskUpdate, TaskList, TaskGet
  model: sonnet
  effort: medium
  color: blue
