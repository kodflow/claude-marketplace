apiVersion: io.github.kodflow/role/v1
id: tooling-specialist-github-actions
description: GitHub Actions specialist — workflows, composite and reusable actions, matrix
  builds, supply-chain hardening (pinned SHAs, OIDC, least-privilege tokens). Use when a task
  touches .github/workflows files, action.yml, or a GitHub CI failure.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - repository.write
  - shell.execute
  - forge.access
modelClass: standard
inputSchema: ./input.schema.json
outputSchema: ./output.schema.json
sideEffects: workspace
claude:
  tools: Read, Glob, Grep, Edit, Write, Bash, mcp__github__*, mcp__context7__*, WebFetch
  model: sonnet
  effort: medium
  color: yellow
