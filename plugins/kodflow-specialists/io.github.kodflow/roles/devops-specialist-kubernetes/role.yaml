apiVersion: io.github.kodflow/role/v1
id: devops-specialist-kubernetes
description: Kubernetes specialist — K8s, K3s, minikube, Helm, operators and GitOps; returns
  JSON with manifests and recommendations. Use when a task touches Kubernetes manifests, Helm
  charts, kustomize, kubectl output or an Argo CD or Flux setup.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - shell.execute
modelClass: standard
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: devops-specialist-kubernetes task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: devops-specialist-kubernetes result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: none
claude:
  tools: Read, Glob, Grep, Bash, WebFetch, mcp__context7__*
  model: sonnet
  effort: medium
  color: orange
