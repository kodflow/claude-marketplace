apiVersion: io.github.kodflow/role/v1
id: os-specialist-alpine
description: Alpine Linux specialist — apk, OpenRC/s6, musl libc, BusyBox and minimal images,
  checked against the official Alpine wiki; returns JSON. Use when a task touches Alpine,
  apk, musl-specific behaviour or an alpine base image. Escalate to sonnet/medium when the
  answer needs judgement beyond pattern matching or the findings are ambiguous.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - shell.execute
modelClass: fast
codexEffort: medium
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: os-specialist-alpine task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: os-specialist-alpine result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: none
claude:
  tools: Read, Glob, Grep, Bash, WebFetch, mcp__context7__*
  model: haiku
  effort: medium
  color: green
