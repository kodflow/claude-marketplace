apiVersion: io.github.kodflow/role/v1
id: developer-executor-shell
description: Shell script, Dockerfile and CI/CD safety analyzer — dangerous patterns, missing
  safeguards, config issues, via deterministic pattern matching; returns JSON. Use when a
  change touches .sh files, Dockerfiles or CI pipeline files. Escalate to sonnet/medium when
  findings need judgement beyond pattern matching or are ambiguous.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - repository.write
  - shell.execute
modelClass: fast
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-executor-shell task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-executor-shell result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: workspace
claude:
  tools: Read, Glob, Grep, Write, Bash, SendMessage, TaskCreate, TaskUpdate, TaskList, TaskGet,
    WebFetch, mcp__context7__*
  model: haiku
  effort: low
  color: blue
