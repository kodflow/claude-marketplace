apiVersion: io.github.kodflow/role/v1
id: os-specialist-debian
description: Debian specialist — apt/dpkg, systemd, stable/testing/unstable branches and Debian
  policy, checked against official documentation; returns JSON. Use when a task touches Debian
  packages, .deb files, apt sources or Debian release behaviour. Escalate to sonnet/medium
  when the answer needs judgement beyond pattern matching or findings are ambiguous.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - shell.execute
modelClass: fast
codexEffort: medium
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: os-specialist-debian task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: os-specialist-debian result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: none
claude:
  tools: Read, Glob, Grep, Bash, WebFetch, mcp__context7__*
  model: haiku
  effort: medium
  color: green
