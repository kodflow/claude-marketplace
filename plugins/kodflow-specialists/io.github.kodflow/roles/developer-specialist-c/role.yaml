apiVersion: io.github.kodflow/role/v1
id: developer-specialist-c
description: C specialist — analyses C but has no Write tool and does not create worktrees,
  commit, or use gh; a fix brief goes to general-purpose with [general-purpose-ok]. Use when
  a change touches .c/.h files or Makefile/CMake C targets.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - shell.execute
modelClass: deep
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-c task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-specialist-c result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: none
claude:
  tools: Read, Glob, Grep, Bash, WebFetch, mcp__context7__*
  model: opus
  effort: medium
  color: blue
