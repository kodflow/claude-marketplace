apiVersion: io.github.kodflow/role/v1
id: developer-executor-correctness
description: Algorithmic correctness analyzer — invariant violations, state machine flaws,
  concurrency bugs, off-by-one and swallowed errors; returns JSON with counterexamples and
  patches. Use when a diff or module needs a proof-style correctness pass. Escalate to opus/max
  when a counterexample search one xhigh pass did not settle.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  - web.official-docs
  optional:
  - repository.write
  - shell.execute
modelClass: verify
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-executor-correctness task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: developer-executor-correctness result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  oneOf:
  - type: object
    required:
    - agent
    - issues
    - commendations
    - metrics
    properties:
      agent:
        type: string
        minLength: 1
      issues:
        type: array
        items:
          type: object
      commendations:
        type: array
        items:
          type: string
      metrics:
        type: object
      summary:
        type: string
      agent_feedback:
        type: string
  - type: string
    minLength: 1
    description: Compact caller return when writing a separate JSON report.
sideEffects: none
claude:
  tools: Read, Glob, Grep, Write, Bash, mcp__context7__resolve-library-id, mcp__context7__query-docs,
    WebFetch, SendMessage, TaskCreate, TaskUpdate, TaskList, TaskGet
  model: opus
  effort: xhigh
  color: blue
