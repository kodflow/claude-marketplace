apiVersion: io.github.kodflow/role/v1
id: devops-specialist-hashicorp
description: HashiCorp stack specialist — Vault, Consul, Nomad, Packer and Boundary; returns
  JSON with configurations and recommendations. Use when a task touches .hcl or .nomad files,
  Vault policies, Consul config or Packer templates.
instructions: ./instructions.md
capabilities:
  required:
  - repository.read
  optional:
  - web.official-docs
  - shell.execute
modelClass: standard
inputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: devops-specialist-hashicorp task brief
  description: The role receives a textual brief or the host's structured brief. The instructions
    define the domain-specific request.
  oneOf:
  - type: string
    minLength: 1
  - type: object
    minProperties: 1
outputSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  title: devops-specialist-hashicorp result
  description: The role instructions specify the applicable report format for the current
    host and mode.
  type:
  - object
  - array
  - string
sideEffects: none
claude:
  tools: Read, Glob, Grep, Bash, SendMessage, TaskCreate, TaskUpdate, TaskList, TaskGet, WebFetch,
    mcp__context7__*
  model: sonnet
  effort: medium
  color: orange
