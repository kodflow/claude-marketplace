# commit-identity.conf — which identity a commit goes out with, per forge.
#
# Copy to ${CLAUDE_CONFIG_DIR:-~/.claude}/kodflow/commit-identity.conf and put
# your own values there: this file is public, yours is not. Without it the
# check is off (said once a session); KODFLOW_COMMIT_IDENTITY=<path> names
# another file, KODFLOW_COMMIT_IDENTITY=off turns the check off.
#
# One rule a line, the first that matches the origin remote wins:
#
#   <host glob>  <path glob>  <name> <<email>>
#
# The host is matched without case, the path is owner/repo without .git, and
# `*` crosses a `/` (github.com  acme/*  matches every repository of acme).
# `<>` is an empty address: git accepts it, so a forge that needs no address
# gets none. A host no rule names, or no origin at all, is refused.
#
# Values below are examples.

# a company GitLab
gitlab.corp.example              *        Jane Doe <jane.doe@corp.example>
# one organisation of github.com before the catch-all
github.com                       acme/*   Jane Doe <jane@acme.example>
github.com                       *        janedoe <1234567+janedoe@users.noreply.github.com>
# a self-hosted Forgejo, the apex and every subdomain
forge.example                    *        Jane Doe <jane@forge.example>
*.forge.example                  *        Jane Doe <jane@forge.example>
# forges that get a pseudonym and no address
git-codecommit.*.amazonaws.com   *        janedoe <>
gitlab.com                       *        janedoe <>
codeberg.org                     *        janedoe <>
